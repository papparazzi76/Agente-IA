<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IA para Agentes Inmobiliarios</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <script>
      window.process = { env: { NODE_ENV: 'production' } };
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'corporate-dark': '#2E2E2E',
              'tech-blue': '#0067A3',
              'pure-white': '#FFFFFF',
              'tech-cyan': '#00BFFF',
            },
            fontFamily: {
              'poppins': ['Poppins', 'sans-serif'],
              'inter': ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { font-family: 'Inter', sans-serif; background-color: #2E2E2E; margin: 0; padding: 0; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', 'sans-serif'; }
      
      .tech-background {
        background: linear-gradient(-45deg, #2E2E2E, #0d1a24, #0067A3, #2E2E2E);
        background-size: 400% 400%;
        animation: gradient-animation 20s ease infinite;
      }
      @keyframes gradient-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      .card-glow-border {
        position: relative;
        z-index: 1;
        transition: transform 0.3s ease;
      }
      .card-glow-border::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px; right: -1px; bottom: -1px;
        background: linear-gradient(45deg, #0067A3, #00BFFF, #0067A3, #00BFFF);
        background-size: 400%;
        z-index: -1;
        filter: blur(8px);
        animation: glowing-border 10s linear infinite, card-pulse 4s ease-in-out infinite;
        opacity: 0.3;
        border-radius: 0.85rem;
        transition: opacity 0.3s ease-in-out;
      }
      .card-glow-border:hover::before {
        opacity: 0.8;
        filter: blur(12px);
      }
      .card-glow-border:hover {
        transform: translateY(-5px);
      }

      @keyframes glowing-border {
        0% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
        100% { background-position: 0% 0%; }
      }
      @keyframes card-pulse {
        0%, 100% { transform: scale(1); opacity: 0.2; }
        50% { transform: scale(1.02); opacity: 0.4; }
      }

      .text-glow { animation: glow 4s ease-in-out infinite; }
      @keyframes glow {
        0%, 100% { text-shadow: 0 0 5px #0067A3, 0 0 10px #00BFFF; }
        50% { text-shadow: 0 0 10px #00BFFF, 0 0 20px #0067A3; }
      }

      .btn-pulse-glow { animation: btn-pulse 2.5s infinite; }
      @keyframes btn-pulse {
        0% { box-shadow: 0 0 0 0 rgba(0, 191, 255, 0.4); }
        70% { box-shadow: 0 0 0 15px rgba(0, 191, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(0, 191, 255, 0); }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.46.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
